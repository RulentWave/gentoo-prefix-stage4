# Added by bootstrap-prefix.sh for x86_64-pc-linux-gnu
USE="unicode nls"
CFLAGS="${CFLAGS} -O2 -pipe"
CXXFLAGS="${CFLAGS}"
MAKEOPTS="-j18"
CONFIG_SHELL="/usr/lib/gentoo-prefix/bin/bash"
DISTDIR="/usr/lib/gentoo-prefix/var/cache/distfiles"
# sandbox does not work well on Prefix, bug #490246
FEATURES="${FEATURES} -usersandbox -sandbox"

PORTAGE_USERNAME="root"
PORTAGE_GRPNAME="root"
PORTAGE_INST_UID="0"
PORTAGE_INST_GID="0"
